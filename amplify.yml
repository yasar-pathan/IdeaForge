version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Go to repository root, run npm ci for monorepo workspaces, then return to frontend
            - cd .. && npm ci && cd frontend
        build:
          commands:
            - npx next build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ../node_modules/**/*
          - .next/cache/**/*
      framework:
        config:
          functionTimeout: 300
